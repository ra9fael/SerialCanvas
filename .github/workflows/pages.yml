name: Publish GitHub Pages build

# build-release.py needs Python (minify_html) and Node (esbuild + `node --check`),
# so both are set up before the build. Pages must use "GitHub Actions" as its
# source; until it does, the deploy job fails with a hint from deploy-pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install minify-html
          npm ci || npm install --no-save --registry=https://registry.npmjs.org esbuild

      - name: Build the single-file artifact
        run: python build-release.py

      - name: Publish index.html at the site root
        run: cp dist/SerialCanvas.html dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
